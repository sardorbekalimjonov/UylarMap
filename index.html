<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>UyMap — xaritadan uy toping</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="v-home">
    <div id="ld"><div class="sp"></div></div>
    <div id="ts"></div>
    <div id="md"><div id="mb"></div></div>
    <div id="det"></div>
    <div id="ap"></div>
    <header>
      <div class="logo" id="lg">Uy<i>Map</i></div>
      <nav id="nv"></nav>
      <div class="sw">
        <input
          id="q"
          autocomplete="off"
          placeholder="Shahar, tuman, ko'cha yoki uy nomini qidiring..."
        />
        <div id="dd"></div>
      </div>
      <div class="rt">
        <button class="b" id="fv">♡ 0</button><span id="au"></span
        ><button class="b p" id="ad">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          Uy joylashtirish
        </button>
      </div>
    </header>
    <section id="hero">
      <div style="flex: 0 0 auto; max-width: 100%">
        <h1>O'zingizga mos uyni xaritadan toping</h1>
        <p>
          Xaritadan kerakli hududni tanlang va shu atrofdagi uylarni ko'ring.
        </p>
        <div class="chips" id="pop"></div>
      </div>
      <div id="feat"></div>
    </section>
    <div class="app">
      <aside id="list">
        <button id="lh"></button>
        <div id="lt">
          <div class="row">
            <b id="cnt"></b><span id="qc"></span
            ><select class="b" id="so" style="margin-left: auto">
              <option value="new">Yangi qo'shilganlar</option>
              <option value="pa">Arzonidan qimmatiga</option>
              <option value="pd">Qimmatidan arzoniga</option>
              <option value="ar">Maydoni bo'yicha</option></select
            ><button class="b" id="ft">Filtrlar</button>
          </div>
          <div class="f" id="fl">
            <select id="ftp">
              <option value="">Uy turi</option></select
            ><select id="fds">
              <option value="">Hudud / tuman</option></select
            ><select id="frm">
              <option value="">Xonalar</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option value="5">5+</option></select
            ><select id="fct">
              <option value="Tashkent">Shahar: Toshkent</option></select
            ><input id="fmn" type="number" placeholder="Min narx $" /><input
              id="fmx"
              type="number"
              placeholder="Maks narx $"
            /><input id="fan" type="number" placeholder="Min m²" /><input
              id="fax"
              type="number"
              placeholder="Maks m²"
            /><button class="b" id="fc" style="grid-column: 1/3">
              Filtrlarni tozalash
            </button>
          </div>
        </div>
        <div id="cards"></div>
      </aside>
      <div id="mapw">
        <canvas id="cv"></canvas>
        <div id="mk"></div>
        <div id="cl"></div>
        <div id="qp" style="display: none">
          <svg width="30" height="38" viewBox="0 0 30 38">
            <path
              d="M15 37C3 22 1 16 1 12a14 14 0 0 1 28 0c0 4-2 10-14 25z"
              fill="#16a34a"
              stroke="#fff"
              stroke-width="2"
            />
            <circle cx="15" cy="12" r="5" fill="#fff" />
          </svg>
        </div>
        <div class="ctl">
          <button id="zi" aria-label="Zoom in">+</button
          ><button id="zo" aria-label="Zoom out">−</button
          ><button id="lc" aria-label="Joylashuvim">
            <svg
              class="i"
              viewBox="0 0 24 24"
              style="width: 20px; height: 20px"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
            </svg>
          </button>
        </div>
        <div id="mini"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
